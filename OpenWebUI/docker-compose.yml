name: open-webui-station

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - "3000:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434 
      - CONTENT_EXTRACTION_ENGINE=docling
      - DOCLING_HTTP_URL=http://docling-serve:8000  # внутренний порт контейнера
      - RAG_SYSTEM_CONTEXT=True
      - VECTOR_DB=qdrant
      - QDRANT_URI=http://qdrant:6333
    volumes:
      - open-webui:/app/backend/data
    restart: always
    networks:
      - openwebui-network

  docling-serve:
    image: quay.io/ds4sd/docling-serve-cpu:v0.3.0
    container_name: docling-serve
    ports:
      - "8001:8000"  # хост:8001 → контейнер:8000
    restart: always
    networks:
      - openwebui-network  # ⬅️ добавлено

  jupyter-engine:
    image: jupyter/scipy-notebook:latest
    container_name: jupyter-engine
    ports:
      - "8888:8888"
    environment:
      - JUPYTER_TOKEN=mysecrettoken123
    restart: always
    networks:
      - openwebui-network  # ⬅️ добавлено
    
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    ports:
      - "8090:8080"
    volumes:
      - ./searxng:/etc/searxng
    environment:
      - BASE_URL=http://localhost:8080/
      - INSTANCE_NAME=MySearXNG
    restart: always
    networks:
      - openwebui-network  # ⬅️ добавлено
    
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: always
    networks:
      - openwebui-network
      

networks:
  openwebui-network:
    driver: bridge
    
volumes:
  open-webui:
  qdrant_storage:
  faster-whisper-cache:
