use_default_settings: true

server:
  secret_key: "change_this_random_string"
  bind_address: "0.0.0.0"
  port: 8080

search:
  formats:
    - html
    - json

engines:
  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    categories: [general]
    disabled: false

  - name: bing
    engine: bing
    disabled: true

  - name: google
    engine: google
    disabled: true

